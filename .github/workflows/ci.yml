name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No id-token, no Azure credentials. Nothing in this workflow can touch a cloud
# resource. Formatting, validation, the unit tests and linting do not need
# cloud access.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      # The tests use mocked providers, so they run here without an Azure session.
      - name: Unit tests
        working-directory: infra
        run: terraform test

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download is rate-limited without it
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Check the app compiles
        run: python3 -m py_compile app/app.py
